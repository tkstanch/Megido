<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}Megido Security{% endblock %}</title>

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">

    <link rel="stylesheet" href="/static/css/tailwind.output.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    {% block extra_css %}{% endblock %}

    <style>
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body class="h-full bg-midnight-indigo bg-cyber-grid">
    <div class="flex h-full scanlines">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 xl:w-72 glass-strong border-r border-gray-200/50 dark:border-gray-700/50 transform -translate-x-full lg:translate-x-0 transition-all duration-300">
            <div class="sticky top-0 z-10 flex items-center gap-3 px-4 py-5 lg:py-6 border-b border-gray-200/50 dark:border-gray-700/50 bg-gradient-to-r from-primary-500 to-secondary-500 backdrop-blur-xl">
                <div class="flex items-center justify-center w-10 h-10 lg:w-12 lg:h-12 rounded-lg bg-white/20 backdrop-blur-sm shadow-lg">
                    <svg class="icon-responsive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 00[...]
                    </svg>
                </div>
                <div>
                    <h1 class="text-base lg:text-lg font-bold text-white">Megido Security</h1>
                    <p class="text-xs lg:text-sm text-white/80">Penetration Testing</p>
                </div>
            </div>

            <nav class="py-4 lg:py-6 space-y-4 lg:space-y-6 px-3" aria-label="Main navigation">
                <div>
                    <div class="px-3 mb-2 lg:mb-3">
                        <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Core Tools</h2>
                    </div>
                    <div class="space-y-1">
                        <a href="/" class="group flex items-center gap-2 lg:gap-3 px-3 py-3 lg:py-3 text-sm lg:text-sm font-medium rounded-xl transition-all duration-200 touch-target {% if request.path == '/' %}bg-gradient-to-r from-primary-600 to-secondary-600 text-white shadow-lg{% else %}text-gray-700 hover:bg-gradient-to-r hover:from-primary-50 hover:to-secondary-50 dark:text-gray-200 dark:hover:bg-gray-800{% endif %}">
                            <svg class="w-5 h-5 flex-shrink-0 {% if request.path == '/' %}{% else %}group-hover:scale-110 transition-transform{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                            <span class="truncate">Dashboard</span>
                            {% if request.path == '/' %}<span class="ml-auto w-1.5 h-1.5 bg-white rounded-full animate-pulse flex-shrink-0"></span>{% endif %}
                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 lg:ml-64 xl:ml-72 flex flex-col min-h-screen">
            <div class="flex-1 padding-responsive animate-fade-in container-responsive">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/megido-error-handler.js"></script>
    <script src="/static/js/megido-utils.js"></script>
    <script src="/static/js/megido-responsive.js"></script>
    <script src="/static/js/megido-toast.js"></script>
    <script src="/static/js/megido-process-tracker.js"></script>
    <script src="/static/js/megido-cancel-helper.js"></script>
    <script src="/static/js/megido-extreme-ui.js"></script>
    <script src="/static/js/megido-particles.js"></script>
    <script src="/static/js/megido-cursor.js"></script>
    <script src="/static/js/megido-cursor-ultra.js"></script>
    <script src="/static/js/megido-theme-customizer.js"></script>

    <script>
        (function() {
            'use strict';
            window.MEGIDO_DEBUG = {% if debug %}true{% else %}false{% endif %};
            if (window.MegidoErrorHandler) {
                window.MegidoErrorHandler.setDebugMode(window.MEGIDO_DEBUG);
            }
        })();
    </script>

    {% block extra_script %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
